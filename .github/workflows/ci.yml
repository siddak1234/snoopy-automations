name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# This repository is PUBLIC and its files hold no secret of any kind: an automation
# receives a run-scoped token at runtime and nothing else (platform invariant 3).
# Every job but Deploy runs on GITHUB_TOKEN alone, which GitHub mints per job and
# expires when the job ends. The workflow's one secret is DISPATCH_APP_KEY, the
# private key of the GitHub App autom8x-dispatch. It lives in environment
# `production` (main only), so only Deploy, on a push to main, can read it; a
# pull request, a fork's included, never reaches it. It mints a token whose one
# permission is Actions read and write on snoopy-backend: it can start that
# repository's Flow CD and read its runs. It reaches no backend credential — no
# host key, no Doppler token, no database URL, no write to any image — and the
# Mac that runs Flow CD believes nothing the dispatch sends but the commit, which
# it checks itself (the platform's ADR-0047 §4). test/workflow-policy.test.ts
# holds these rules.
permissions:
  contents: read

jobs:
  # The automations, read from the tree: every folder under automations/ with a
  # Dockerfile, as a JSON list. Publish takes its matrix from it, so a new automation is
  # built, published and deployed with no edit here. Image takes `images`: on a pull
  # request only the flows whose image inputs changed (scripts/changed-images.mjs, the rule
  # the platform's Flow CD uses; a change under packages/, the root lock or this file builds
  # them all), and on a push to main every one.
  list:
    name: List
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      automations: ${{ steps.list.outputs.automations }}
      images: ${{ steps.images.outputs.images }}
    steps:
      # The whole history, so a pull request's changes can be read against its base.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: List automations/*/Dockerfile
        id: list
        run: |
          shopt -s nullglob
          names=()
          for dockerfile in automations/*/Dockerfile; do
            name="${dockerfile#automations/}"
            names+=("${name%/Dockerfile}")
          done
          if [ "${#names[@]}" -eq 0 ]; then
            echo "automations/ holds no Dockerfile" >&2
            exit 1
          fi
          automations="$(printf '%s\n' "${names[@]}" | jq -R . | jq -cs .)"
          echo "automations=$automations" >> "$GITHUB_OUTPUT"
          echo "automations: $automations"

      - name: List the images this run builds
        id: images
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: origin/${{ github.base_ref }}
          AUTOMATIONS: ${{ steps.list.outputs.automations }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            images="$(node scripts/changed-images.mjs --base "$BASE")"
          else
            images="$AUTOMATIONS"
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "images: $images"

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      # The whole history, so `npm run check:docs` can read every commit since the
      # base it is given in DOCS_BASE (the pull request's base branch; `main` on a push).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: a dependency's install script is arbitrary code running
      # with the build's privileges. Nothing here has a postinstall to lose.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Format, docs, build, types, tests — the same gate that runs before every
      # commit, in that order (CLAUDE.md, "Gates and push"): the docs checks first
      # (`npm run check:docs`, `npm run map -- --check`, the reference audit), then
      # the build, since the SDK's emitted types are what an automation typechecks
      # against. `test/architecture.test.ts` is inside it: no platform package
      # imported, every manifest valid, every workspace carrying the gate's
      # scripts, the SDK and the kit consumable through their published entries
      # and shipping their built dist on Node built-ins alone, no environment file
      # and no recovered client data tracked; `test/isolation.test.ts`, no
      # automation depending on another. `test/conformance.test.ts` holds every
      # automation to the manifests it serves. The gate's last step re-emits
      # docs/repo-facts/snoopy-automations.json.
      - name: Verify formatting, docs, build, types, and tests
        env:
          DOCS_BASE: origin/${{ github.base_ref || 'main' }}
        run: npm run verify

      # The review checklist's machine-checkable rows (scripts/review-rows.ts; /create-flow's
      # templates/review.md marks them (CI)) for every flow this range touches, written to the
      # run's summary for the reviewer. A FAIL row fails Verify.
      - name: Review rows
        env:
          DOCS_BASE: origin/${{ github.base_ref || 'main' }}
        run: npx tsx scripts/review-rows.ts --base "$DOCS_BASE" --summary "$GITHUB_STEP_SUMMARY"

      # Split deliberately into a blocking check and a reporting one, as the
      # platform does. What ships is what must be clean, so the runtime tree is the
      # gate; dev tooling is reported but does not fail the build, because a gate
      # that goes red for things nobody can act on is a gate somebody switches off.
      # Today there are no third-party runtime dependencies: every automation uses
      # only the local SDK and kit, which themselves have none. That makes this pass
      # trivially clean and is exactly why it must remain — the day one is added is
      # the day nobody thinks to check.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit build and test dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

  # The pull request's gate, once per automation: the Dockerfile built, smoke-tested
  # and scanned before anything may be pushed. This job never authenticates to a
  # registry and never pushes, including on pull requests from forks. The bytes
  # production runs are built, pushed, proven and attested by Publish, below, from
  # the same Dockerfile. The matrix is List's `images`: on a pull request the flows whose
  # image inputs changed, skipped when none did; on a push every automations/*/Dockerfile.
  image:
    name: Image
    needs: list
    if: ${{ needs.list.outputs.images != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        automation: ${{ fromJSON(needs.list.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ${{ matrix.automation }}, amd64
        run: >-
          docker build --platform linux/amd64
          --file automations/${{ matrix.automation }}/Dockerfile
          --tag autom8x-${{ matrix.automation }}:${{ github.sha }} .

      # Starts the final stage, which proves the standalone lock installed a real
      # SDK package rather than leaving a workspace link behind in the image, and
      # that the manifests the runner reads at startup were copied into it.
      - name: Smoke-test the packaged service
        env:
          AUTOMATION: ${{ matrix.automation }}
        run: |
          container="$AUTOMATION-smoke"
          trap 'docker logs "$container" || true; docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1:18080:8080 \
            "autom8x-$AUTOMATION:${{ github.sha }}" >/dev/null
          for attempt in {1..20}; do
            response="$(curl --fail --silent --show-error http://127.0.0.1:18080/health/live)" && break
            sleep 1
          done
          test "${response:-}" = "{\"status\":\"ok\",\"templateId\":\"$AUTOMATION\",\"contractVersion\":1}"

      # Pinned because this action is itself part of the security boundary. Only
      # actionable CRITICAL/HIGH findings block; the second pass still reports
      # upstream findings for which no fixed package exists yet.
      - name: Scan fixable CRITICAL and HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autom8x-${{ matrix.automation }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Report vulnerabilities without an upstream fix
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: autom8x-${{ matrix.automation }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'
          format: table

  # A merge to main is the only publishing event. packages:write, id-token:write
  # and attestations:write exist on this job alone, and it authenticates with its
  # own short-lived GITHUB_TOKEN.
  #
  # Build once, push by digest, prove that digest, attest it, then name it — once
  # per automation. Until 2026-10-04 this job rebuilt the image the Image job had
  # just smoke-tested and scanned, so the bytes that reached GHCR were never the
  # bytes that had been checked. Now the one build is pushed with no tag; the smoke
  # test and both Trivy passes run against `IMAGE_NAME@sha256:…`, which is exactly
  # what was pushed; only when they pass is that digest attested, and only then
  # does `imagetools create` give that index its commit tag. A digest that fails
  # stays untagged and unattested: nothing names it, so nothing can deploy it.
  publish:
    name: Publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [list, verify, image]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        automation: ${{ fromJSON(needs.list.outputs.automations) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/autom8x-${{ matrix.automation }}
    steps:
      - name: Checkout
        # This job holds packages:write, so every action it executes is immutable.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR with this job's token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # No `tags`: the image is pushed by digest alone, so the registry holds the
      # bytes but nothing names them yet. The action's default provenance
      # attestation is kept, so what is pushed is an OCI image index (the amd64
      # manifest plus its attestation) and the digest returned is the INDEX
      # digest, the one the attestation below names and the platform's Flow CD runs.
      - name: Build and push ${{ matrix.automation }} by digest
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: automations/${{ matrix.automation }}/Dockerfile
          platforms: linux/amd64
          push: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Fail if Buildx did not return a digest: an unfindable digest stops the
      # deploy rather than becoming guesswork. Every step below is given
      # this one reference and nothing else.
      - name: Resolve the pushed digest
        id: pushed
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx returned no valid image digest" >&2
            exit 1
          fi
          echo "reference=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed by digest: $IMAGE_NAME@$DIGEST"

      # The Image job's smoke test, run against the pushed digest itself.
      - name: Smoke-test the pushed digest
        env:
          REFERENCE: ${{ steps.pushed.outputs.reference }}
          AUTOMATION: ${{ matrix.automation }}
        run: |
          container="$AUTOMATION-smoke"
          trap 'docker logs "$container" || true; docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1:18080:8080 \
            "$REFERENCE" >/dev/null
          for attempt in {1..20}; do
            response="$(curl --fail --silent --show-error http://127.0.0.1:18080/health/live)" && break
            sleep 1
          done
          test "${response:-}" = "{\"status\":\"ok\",\"templateId\":\"$AUTOMATION\",\"contractVersion\":1}"

      # The Image job's two Trivy passes, run against the pushed digest itself.
      - name: Scan the pushed digest for fixable CRITICAL and HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pushed.outputs.reference }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Report vulnerabilities in the pushed digest without an upstream fix
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pushed.outputs.reference }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'
          format: table

      # The proven digest, attested: a SLSA build provenance signed for this
      # workflow at this commit on a GitHub-hosted runner, pushed beside the image.
      # Flow CD refuses a digest without it (`gh attestation verify
      # --bundle-from-oci`, the platform's ADR-0047 §4.3). No storage record: those
      # exist for organization repositories only.
      - name: Attest the proven digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # Only now is the digest named. The sole tag is the full commit SHA; no
      # latest, main, branch, or other moving tag is created. `imagetools create`
      # given one index copies that index as it is, so the tag resolves to the
      # very digest proven above; read back and compared here, because a
      # promotion may read the digest through this tag.
      - name: Tag the proven digest with the commit
        env:
          REFERENCE: ${{ steps.pushed.outputs.reference }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAG: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker buildx imagetools create --tag "$TAG" "$REFERENCE"
          tagged="$(docker buildx imagetools inspect "$TAG" --format '{{println .Manifest.Digest}}' | head -1)"
          if [ "$tagged" != "$DIGEST" ]; then
            echo "tag $TAG resolves to $tagged, not to the proven $DIGEST" >&2
            exit 1
          fi
          {
            echo "### Image published: ${{ matrix.automation }}"
            echo
            echo "- \`$REFERENCE\`"
            echo "- \`$TAG\` resolves to the same index digest"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tagged: $TAG -> $DIGEST"

  # The merge is the deploy (the platform's ADR-0047 §1). Once every image is
  # published and attested, this job starts snoopy-backend's Flow CD for this
  # commit, waits for it, and prints each automation's outcome (README.md, Build
  # a flow). It is red when Flow CD failed or its result is
  # not ok. It holds no GITHUB_TOKEN permission, checks nothing out and runs no
  # code of this repository: its only inputs are the commit and the App token.
  deploy:
    name: Deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    permissions: {}
    timeout-minutes: 90
    steps:
      - name: Mint a token for snoopy-backend's Actions
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_KEY }}
          owner: siddak1234
          repositories: snoopy-backend
          permission-actions: write

      # GitHub's answer to the dispatch carries the run it started
      # (`return_run_details`), so the run watched is the one dispatched.
      - name: Dispatch Flow CD for this commit
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          run_id="$(gh api --method POST repos/siddak1234/snoopy-backend/actions/workflows/flow-cd.yml/dispatches \
            -f ref=main -f "inputs[sha]=$SHA" -F return_run_details=true --jq .workflow_run_id)"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "the dispatch answered no run id" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Flow CD: https://github.com/siddak1234/snoopy-backend/actions/runs/$run_id"

      - name: Wait for Flow CD and print its result
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          status=0
          gh run watch "$RUN_ID" --repo siddak1234/snoopy-backend --exit-status --interval 30 >/dev/null || status=$?
          dir="$RUNNER_TEMP/flow-cd-result"
          if ! gh run download "$RUN_ID" --repo siddak1234/snoopy-backend --name flow-cd-result --dir "$dir"; then
            echo "Flow CD run $RUN_ID left no flow-cd-result artifact" >&2
            exit 1
          fi
          jq . "$dir/result.json"
          {
            echo "### Flow CD"
            echo
            echo "https://github.com/siddak1234/snoopy-backend/actions/runs/$RUN_ID"
            echo
            echo '| Automation | Version | Outcome | Digest | Codes |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r '.templates[] | "| \(.templateId) | v\(.version) | \(.outcome) | \(.digest) | \(.codes | join(", ")) |"' "$dir/result.json"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "Flow CD run $RUN_ID failed" >&2
            exit 1
          fi
          if [ "$(jq -r .ok "$dir/result.json")" != true ]; then
            echo "Flow CD's result is not ok" >&2
            exit 1
          fi

  # The one check for the ruleset to require, once it has reported on a pull
  # request and on main. Green only when every job above succeeded — for a matrix
  # job, every one of its builds. Publish and Deploy are push-only by their own
  # `if`, so on a pull request their "skipped" is allowed, and so is Image's when List
  # found no flow whose image inputs changed; a skip anywhere else, a failure or a
  # cancellation is red. A job added above must be named in `needs` too, or this check
  # never sees it.
  all-green:
    name: all-green
    if: always()
    needs: [list, verify, image, publish, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          IMAGES: ${{ needs.list.outputs.images }}
        run: |
          red=0
          while IFS=$'\t' read -r job result; do
            case "$result" in
              success) verdict=ok ;;
              skipped)
                if { [ "$job" = publish ] || [ "$job" = deploy ]; } && [ "$EVENT_NAME" = pull_request ]; then
                  verdict='ok (push-only job, skipped on a pull request)'
                elif [ "$job" = image ] && [ "$IMAGES" = '[]' ] && [ "$EVENT_NAME" = pull_request ]; then
                  verdict='ok (no flow whose image inputs changed)'
                else
                  verdict=RED
                  red=1
                fi
                ;;
              *)
                verdict=RED
                red=1
                ;;
            esac
            printf '%-8s %-10s %s\n' "$job" "$result" "$verdict"
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          exit "$red"
