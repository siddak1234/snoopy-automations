# Dependency updates arrive as pull requests, through the same CI gate as any
# other change. Grouped so a week's minor and patch bumps are one review, not ten;
# a major bump stays its own pull request because it may need a code change.
#
# The Docker entry points at the first shipping automation; pointing Dependabot
# at a directory that holds no Dockerfile only produces a failed update run.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    # Owner decision 2026-09-08 (platform §0.1): the TypeScript major is a toolchain
    # migration made deliberately, and @types/node tracks the runtime major, which
    # stays on the 22 LTS the platform image and CI pin.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # This lock is consumed independently by the image build; the root workspace
  # lock cannot stand in for it.
  - package-ecosystem: npm
    directory: /automations/invoice-intake
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /automations/invoice-intake
    schedule:
      interval: weekly
    # The runtime major is a deliberate move, not a bot bump (owner, 2026-09-08).
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
