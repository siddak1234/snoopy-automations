# Dependency updates arrive as pull requests, through the same CI gate as any
# other change. ONE pull request per ecosystem per MONTH, everything grouped —
# the owner's direction 2026-09-08 after a week's worth (ten pull requests,
# each a notification) arrived in one batch. A major that must not move is
# `ignore`d below rather than left to be closed by hand every month.
#
# The Docker entries point at the shipping automations; pointing Dependabot at a
# directory that holds no Dockerfile only produces a failed update run.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      everything:
        patterns: ['*']
    # Move the lock only, never a range in package.json. Every red CI run this
    # repository has had (6 of 47, counted 2026-10-03) was a Dependabot npm pull
    # request that `npm ci` refused with EUSAGE: a range raised in one package.json
    # while the OTHER lock — the root workspace lock, or automations/invoice-intake's
    # standalone lock, which the image build consumes on its own — stayed behind.
    # A lock moved within its committed ranges stays in sync with every
    # package.json, so there is nothing for `npm ci` to refuse.
    versioning-strategy: lockfile-only
    # Owner decision 2026-09-08 (platform §0.1): the TypeScript major is a toolchain
    # migration made deliberately, and @types/node tracks the runtime major, which
    # stays on the 22 LTS the platform image and CI pin.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # No npm entry for automations/invoice-intake: its only dependency is the local
  # SDK (file:), and its dev tooling is never installed in the image (the
  # Dockerfile's `--omit=dev`). An entry there raised ranges the root lock did
  # not carry, and the root entry raised ranges this lock did not carry.

  - package-ecosystem: docker
    directory: /automations/invoice-intake
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # The runtime major is a deliberate move, not a bot bump (owner, 2026-09-08).
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # invoice-check moved in from the platform repository on 2026-10-08 (its
  # BUILD-PLAN 25.3.8); the same base image and the same rule.
  - package-ecosystem: docker
    directory: /automations/invoice-check
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      everything:
        patterns: ['*']
